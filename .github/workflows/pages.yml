# Builds the site with Jekyll and deploys it to GitHub Pages.
# Pull requests only build (to catch errors); pushes to main build and deploy.
name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

# One deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Ruby
        # v1.345.0; reads the version from .ruby-version and installs gems from Gemfile.lock.
        # .ruby-version can't contain comments (this action reads the whole file), so:
        # it's 3.3.14 rather than GitHub Pages' 3.3.4 because ubuntu-latest (26.04) only
        # has the latest patch release of each Ruby series available.
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f
        with:
          bundler-cache: true

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
