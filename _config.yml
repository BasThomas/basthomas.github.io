title: Bas' Blog
email: bas@basbroek.nl
description: "When you change the way you look at things, the things you look at, change."
tagline: "Accessibility, Swift & Apple platforms"
author: Bas Broek
baseurl: ""
url: https://www.basbroek.nl

github_username: BasThomas
mastodon:
- username: bas
  instance: iosdev.space

social:
  name: Bas Broek
  links:
    - https://github.com/BasThomas
    - https://iosdev.space/@bas

header_pages:
  - about.md
  - resume.md
  - speaking.md

minima:
  date_format: "%-d %B %Y"

excerpt_separator: <!--more-->

markdown: kramdown
sass:
  style: compressed
  sourcemap: never
  # minima 2.5's stylesheets use Sass features that Dart Sass warns about; hide those warnings.
  silence_deprecations: [import, global-builtin, color-functions, slash-div]
future: true # publish posts dated in the future right away
theme: minima
permalink: pretty
plugins: ['jekyll-feed', 'jekyll-sitemap']
exclude:
  - Gemfile
  - Gemfile.lock
  - Readme.md
  - LICENSE
  - vendor # gems installed by the GitHub Actions build

# Link previews (jekyll-seo-tag): pages use the avatar, posts get a generated image (below).
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/general/avatar.jpg

# Generated link preview images for posts (jekyll-og-image).
og_image:
  domain: basbroek.nl
  canvas:
    height: 630
    background_color: "#181818" # the site's dark mode colors
  image:
    path: assets/general/avatar.jpg
  header:
    font_family: "Inter, Bold"
    color: "#eeeeee"
  content:
    font_family: "Inter, Regular"
    color: "#999999"
  metadata:
    fields: ["date"]
    date_format: "%-d %B %Y"
